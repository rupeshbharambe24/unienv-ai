#:schema ../schema/recipe.schema.json
schema = "unienv/recipe/v0"
id = "browser"
summary = "Headless Chromium via Playwright shared across every AI tool (opt-in: ~570 MB)"
default = false
maintainers = ["github:rupeshbharambe24", "github:KunjMaheshwari"]
license_note = "Playwright Apache-2.0; Chromium BSD-3-Clause"

[python]
packages = ["playwright"]
imports = ["playwright"]

[system.debian]
apt = []

[system.fedora]
dnf = []

[system.arch]
pacman = []

[verify]
bins = []

[agent]
notes = """
- One shared Playwright browser directory is exported via `PLAYWRIGHT_BROWSERS_PATH="$UNIENV_HOME/browsers"` when the `browser` battery is active.
- Launch headless Chromium in `ue-py` with `from playwright.sync_api import sync_playwright`:
  `p.chromium.launch(headless=True)`
- In Docker or container environments where user-namespace sandboxing is unavailable, pass `args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]` as a fallback.
- If macOS Seatbelt sandboxes fail with `bootstrap_check_in` Mach port errors, run browser commands outside the sandbox or grant Mach port lookup in the sandbox profile.
- Ensure Chromium is downloaded into the shared folder: `PLAYWRIGHT_BROWSERS_PATH="$UNIENV_HOME/browsers" ue-py -m playwright install chromium` (on Linux, run `sudo $UNIENV_HOME/bin/ue-py -m playwright install-deps chromium` if any shared library is missing).
"""
