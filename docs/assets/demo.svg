<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="t">
  <title id="t">unienv and unienv doctor output in a terminal</title>
  <rect width="900" height="610" rx="14" fill="#0d1117"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6.5" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">zsh — unienv</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#c9d1d9">
    <text x="24" y="74"><tspan fill="#7ee787">$</tspan> unienv</text>
    <text x="24" y="98"><tspan fill="#5eead4" font-weight="700">UniEnv AI</tspan> 0.1.0 <tspan dx="10" fill="#8b949e">one always-ready environment for every AI tool</tspan></text>
    <text x="40" y="130" fill="#8b949e">home</text><text x="140" y="130">~/.unienv</text>
    <text x="40" y="152" fill="#8b949e">batteries</text><text x="140" y="152">core, data, ocr, office, pdf</text>
    <text x="40" y="174" fill="#8b949e">python</text><text x="140" y="174">ue-py · 24 packages</text>
    <text x="40" y="196" fill="#8b949e">node</text><text x="140" y="196">ue-node · 2 packages</text>
    <text x="40" y="218" fill="#8b949e">tools</text><text x="140" y="218">uv, node, rg, jq, tesseract, pandoc, soffice-safe, pdftotext, qpdf, gs</text>
    <text x="40" y="240" fill="#8b949e">agents</text><text x="140" y="240">Claude Code, Codex CLI</text>

    <text x="24" y="280"><tspan fill="#7ee787">$</tspan> unienv doctor</text>
    <text x="40" y="304" fill="#3fb950">✓</text><text x="60" y="304">Python 3.12.13 at ~/.unienv/py/.venv/bin/python</text>
    <text x="40" y="326" fill="#3fb950">✓</text><text x="60" y="326">24 battery modules import cleanly</text>
    <text x="40" y="348" fill="#3fb950">✓</text><text x="60" y="348">pandoc</text><text x="190" y="348">/opt/homebrew/bin/pandoc</text>
    <text x="40" y="370" fill="#3fb950">✓</text><text x="60" y="370">soffice-safe</text><text x="190" y="370">~/.unienv/bin/soffice-safe</text>
    <text x="40" y="392" fill="#3fb950">✓</text><text x="60" y="392">`zsh -c` finds ue-py</text>
    <text x="40" y="414" fill="#3fb950">✓</text><text x="60" y="414">`bash -lc` finds ue-py</text>
    <text x="40" y="436" fill="#3fb950">✓</text><text x="60" y="436">Claude Code: ~/.claude/CLAUDE.md</text>
    <text x="40" y="458" fill="#3fb950">✓</text><text x="60" y="458">Codex CLI: ~/.codex/AGENTS.md</text>
    <text x="40" y="480" fill="#58a6ff">i</text><text x="60" y="480"><tspan fill="#8b949e">/opt/homebrew/bin/python3 is externally managed (PEP 668)</tspan></text>
    <text x="24" y="508"><tspan font-weight="700">unienv doctor: all good</tspan></text>

    <text x="24" y="548"><tspan fill="#7ee787">$</tspan> ue need openpyxl</text>
    <text x="24" y="572"><tspan fill="#3fb950">✓</tspan> already available: openpyxl</text>
    <rect x="24" y="584" width="9" height="17" fill="#c9d1d9" opacity="0.8"/>
  </g>
</svg>
