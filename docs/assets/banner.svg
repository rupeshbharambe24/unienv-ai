<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">UniEnv AI</title>
  <desc id="d">One always-ready environment for every AI tool</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- mark: many agents (outer nodes) sharing one environment (core) -->
  <g transform="translate(232 180)">
    <g stroke="#6cc7e8" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-104"/>
      <line x1="0" y1="0" x2="90" y2="-52"/>
      <line x1="0" y1="0" x2="90" y2="52"/>
      <line x1="0" y1="0" x2="0" y2="104"/>
      <line x1="0" y1="0" x2="-90" y2="52"/>
      <line x1="0" y1="0" x2="-90" y2="-52"/>
    </g>
    <g fill="#0b1020" stroke="url(#mark)" stroke-width="3">
      <circle cx="0" cy="-104" r="13"/>
      <circle cx="90" cy="-52" r="13"/>
      <circle cx="90" cy="52" r="13"/>
      <circle cx="0" cy="104" r="13"/>
      <circle cx="-90" cy="52" r="13"/>
      <circle cx="-90" cy="-52" r="13"/>
    </g>
    <rect x="-46" y="-46" width="92" height="92" rx="22" fill="url(#mark)"/>
    <text x="0" y="15" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#0b1020">ue</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="410" y="150" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">UniEnv <tspan fill="#5eead4">AI</tspan></text>
    <text x="414" y="200" font-size="28" fill="#cbd5e1">One always-ready environment for every AI tool.</text>
    <text x="414" y="238" font-size="20" fill="#94a3b8">Install document, PDF, OCR and data tools once. Every agent finds them, every time.</text>

    <g font-size="16" font-weight="600" fill="#e2e8f0">
      <rect x="414" y="270" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="476" y="292" text-anchor="middle">Claude Code</text>
      <rect x="550" y="270" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="594" y="292" text-anchor="middle">Codex</text>
      <rect x="650" y="270" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="708" y="292" text-anchor="middle">Gemini CLI</text>
      <rect x="778" y="270" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="833" y="292" text-anchor="middle">OpenCode</text>
      <rect x="900" y="270" width="174" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#818cf8" stroke-opacity="0.35"/>
      <text x="987" y="292" text-anchor="middle">+ any shell agent</text>
    </g>
  </g>
</svg>
