name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Claude Desktop Extension
        run: |
          scripts/build-mcpb.sh
          npx -y @anthropic-ai/mcpb validate mcpb/manifest.json
      - name: Generate SHA256SUMS
        run: |
          mkdir -p dist
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_REF_NAME}.tar.gz" -o "dist/unienv-ai-${GITHUB_REF_NAME}.tar.gz"
          (cd dist && sha256sum "unienv-ai-${GITHUB_REF_NAME}.tar.gz" unienv.mcpb > SHA256SUMS)
      - name: Attach unienv.mcpb and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/unienv.mcpb dist/SHA256SUMS --clobber || gh release create "$GITHUB_REF_NAME" dist/unienv.mcpb dist/SHA256SUMS --generate-notes
