name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install ruff
        run: pip install --quiet ruff==0.17.5

      - name: ruff check
        run: ruff check src tests

      - name: ruff format
        run: ruff format --check src tests

      - name: shellcheck
        # shellcheck is preinstalled on ubuntu-latest
        run: shellcheck install.sh shims/* mcpb/server/*.sh scripts/*.sh bench/*.sh tests/*.sh

  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate recipes against schema/recipe.schema.json
        run: |
          pip install --quiet jsonschema
          python3 scripts/validate_recipes.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          python3 -m py_compile src/unienv.py
          bash -n install.sh
          for f in tests/smoke.sh shims/*; do sh -n "$f"; done

      - name: Install LibreOffice for CSV regression tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc libreoffice-writer

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: --add validation test
        run: python3 tests/add_battery_test.py

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils qpdf ghostscript tesseract-ocr jq ripgrep fish

      - name: Install (macOS without LibreOffice to keep CI fast)
        if: runner.os == 'macOS'
        run: |
          brew install pandoc poppler qpdf ghostscript tesseract duckdb jq ripgrep
          ./install.sh --no-system --exclude libreoffice

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: ./install.sh --no-system --exclude libreoffice

      - name: Fish non-interactive PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          test "$(env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin fish -c 'command -v ue-py')" = "$HOME/.unienv/bin/ue-py"

      - name: Doctor
        run: |
          ~/.unienv/bin/unienv doctor --json | tee doctor.json
          ~/.unienv/bin/unienv doctor --json --fix | python3 -m json.tool > doctor-fixed.json

      - name: Smoke test from a fresh non-interactive shell
        run: env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin bash -lc tests/smoke.sh

      - name: MCP server end-to-end
        run: python3 tests/mcp_test.py

      - name: Build and validate the Claude Desktop Extension
        run: |
          scripts/build-mcpb.sh
          npx -y @anthropic-ai/mcpb validate mcpb/manifest.json

      - name: need + rollback
        run: |
          # two agents adding packages at the same time: both must end up installed
          ~/.unienv/bin/unienv need tomli-w & a=$!
          ~/.unienv/bin/unienv need six & b=$!
          wait $a; wait $b
          ~/.unienv/bin/ue-py -c "import tomli_w, six"
          jq -e '.extras.python | index("tomli-w") and index("six")' ~/.unienv/state.json
          ! ~/.unienv/bin/unienv need this-package-does-not-exist-unienv-ci
          ~/.unienv/bin/unienv doctor

  libreoffice:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages including LibreOffice
        run: |
          brew install pandoc poppler qpdf ghostscript tesseract duckdb jq ripgrep
          brew install --cask libreoffice
          ./install.sh --no-system

      - name: Doctor with LibreOffice enabled
        run: ~/.unienv/bin/unienv doctor

      - name: Smoke test with LibreOffice conversions
        run: env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin bash -lc tests/smoke.sh

      - name: MCP server end-to-end with LibreOffice conversions
        run: python3 tests/mcp_test.py
